<!DOCTYPE html>
<html>
<head>
    <title>Image Processing</title>
</head>
<body>
    <h1>Image Processing Application</h1>

    <p>Upload an image and process it.</p>

    
<form method="POST" enctype="multipart/form-data">
    <label for="image">Choose an image:</label>
    <input type="file" id="image" name="image" accept="image/*" required>

    <br><br>

    <label for="operation">Choose operation:</label>
    <select id="operation" name="operation">
        <option value="grayscale">Grayscale</option>
        <option value="brightness">Brightness</option>
    </select>

    <br><br>

    <label for="factor">Brightness (0.5 to 2.0):</label>
    <input
        type="number"
        id="factor"
        name="factor"
        min="0.5"
        max="2.0"
        step="0.1"
        value="1.5"
    >

    <br><br>

    <button type="submit">Process Image</button>
</form>

{% if output_filename %}
    <h2>Grayscale Image</h2>
    <img
        src="{{ url_for('show_processed', filename=output_filename) }}"
        alt="Processed grayscale image"
        width="400"
    >
{% endif %}
</body>
</html>
